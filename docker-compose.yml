services:
  frontend:
    build:
      context: .
      # valores lidos do arquivo .env desta pasta (veja .env.example)
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?defina no arquivo .env}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?defina no arquivo .env}
    container_name: astro-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
